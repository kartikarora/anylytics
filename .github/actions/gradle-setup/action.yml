name: 'Gradle Setup'
description: 'Standardizes JDK 21 and Gradle Caching across all jobs'

runs:
  using: "composite"
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
